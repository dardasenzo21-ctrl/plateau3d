<title>Immeuble parisien en 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Instrument+Serif:ital@1&display=swap">
<style>
  /* Layout : scène plein écran, accent neutre, Atkinson Hyperlegible. */
  :root { --bg:#0B0B0B; --fg:#FFFFFF; --muted:#A3A3A3; --panel:rgba(11,11,11,.72); --line:rgba(255,255,255,.16); --bleu:#9A9A9A; color-scheme:dark;
    --font:"Atkinson Hyperlegible",Verdana,Arial,sans-serif; --serif:"Instrument Serif",Georgia,serif }
  :root.blanc { --bg:#FFFFFF; --fg:#0B0B0B; --muted:#5C5C5C; --panel:rgba(255,255,255,.8); --line:rgba(11,11,11,.14); color-scheme:light }

  html,body{ height:100%; margin:0; background:var(--bg); color:var(--fg); font-family:var(--font); font-size:16px; line-height:1.5; overflow:hidden }
  #app{ position:relative; height:100%; min-height:300px; overflow:hidden }
  #app canvas{ display:block; width:100%; height:100%; cursor:grab; touch-action:none } #app canvas:active{ cursor:grabbing }
  #charge{ position:absolute; inset:0; display:grid; place-items:center; font-weight:700 }
  .titre{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:12px 16px; backdrop-filter:blur(10px); position:absolute; top:calc(16px + env(safe-area-inset-top,0px)); left:max(16px,env(safe-area-inset-left,0px)); pointer-events:none }
  .titre .marque{ font-size:12px; letter-spacing:.08em; color:var(--fg); font-weight:700; margin-bottom:2px } .titre h1{ margin:0; font-size:24px; line-height:1.2; letter-spacing:-.01em } .titre p{ margin:2px 0 0; color:var(--muted); font-size:14px }
  .outils{ position:absolute; top:calc(16px + env(safe-area-inset-top,0px)); right:max(16px,env(safe-area-inset-right,0px)); display:flex; gap:6px }
  .niveaux{ position:absolute; right:max(16px,env(safe-area-inset-right,0px)); top:50%; transform:translateY(-50%); display:grid; gap:4px; background:var(--panel); border:1px solid var(--line); border-radius:24px; padding:6px; backdrop-filter:blur(10px) }
  button{ font:inherit; font-size:15px; min-height:36px; min-width:46px; padding:4px 13px; border-radius:999px; border:1px solid transparent; background:transparent; color:var(--fg); cursor:pointer }
  .outils button{ background:var(--panel); border-color:var(--line); backdrop-filter:blur(10px) }
  button[aria-pressed="true"]{ background:var(--fg); color:var(--bg) }
  .logo{ height:22px; width:auto; display:block; margin-bottom:12px }
  .titre em{ font-family:var(--serif); font-style:italic; font-weight:400; color:var(--bleu); font-size:1.18em } .mention{ position:absolute; bottom:calc(6px + env(safe-area-inset-bottom,0px)); right:max(16px,env(safe-area-inset-right,0px)); font-size:11px; color:var(--muted); pointer-events:none }
  button:focus-visible{ outline:3px solid var(--bleu); outline-offset:2px }
  @media (max-width:560px){ .outils{ top:calc(70px + env(safe-area-inset-top,0px)); left:max(16px,env(safe-area-inset-left,0px)); right:auto } }
  .amenag{ position:absolute; left:max(16px,env(safe-area-inset-left,0px)); top:50%; transform:translateY(-50%); display:grid; gap:4px; background:var(--panel); border:1px solid var(--line); border-radius:24px; padding:10px 6px 6px; backdrop-filter:blur(10px) } .amenag b{ font-size:12px; color:var(--muted); text-align:center; padding:0 6px 2px }
  @media (max-width:560px){ .amenag{ top:auto; bottom:calc(150px + env(safe-area-inset-bottom,0px)); transform:none } }
  .fiche{ position:absolute; left:max(16px,env(safe-area-inset-left,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px)); max-width:min(320px,calc(100% - 110px)); background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; backdrop-filter:blur(10px) }
  .fiche h2{ margin:0 0 4px; font-size:17px } .fiche ul{ margin:0; padding:0; list-style:none; display:grid; gap:1px; font-size:14px; max-height:30vh; overflow:auto; font-variant-numeric:tabular-nums }
  .fiche li{ display:flex; justify-content:space-between; gap:14px } .fiche li span:last-child{ color:var(--muted); white-space:nowrap } .fiche p{ margin:0; font-size:14px; color:var(--muted) }

  @media (max-width:560px){

    .outils button,.amenag button,.niveaux button{ font-size:14px; min-height:34px; padding:3px 11px }
    .amenag{ top:calc(196px + env(safe-area-inset-top,0px)); bottom:auto; transform:none; grid-auto-flow:column; align-items:center; padding:4px; border-radius:999px } .amenag b{ padding:0 4px 0 8px }
    .niveaux{ top:calc(196px + env(safe-area-inset-top,0px)); transform:none; gap:2px; padding:4px }
    .fiche{ right:calc(max(16px,env(safe-area-inset-right,0px)) + 76px); max-width:none; bottom:calc(26px + env(safe-area-inset-bottom,0px)); padding:10px 12px } .fiche ul{ max-height:20vh }
  }

  @media (max-height:500px) and (min-width:561px){
    .titre{ padding:8px 12px } .logo{ height:14px; margin-bottom:4px } .titre h1{ font-size:17px } .titre p{ font-size:12px; line-height:1.3 }

    .niveaux{ top:calc(60px + env(safe-area-inset-top,0px)); transform:none; grid-template-rows:repeat(5,auto); grid-auto-flow:column; gap:2px; padding:4px; border-radius:18px }
    .amenag{ top:calc(100px + env(safe-area-inset-top,0px)); transform:none; grid-auto-flow:column; align-items:center; padding:4px; border-radius:999px } .amenag b{ padding:0 4px 0 8px }
    .fiche{ max-width:300px; padding:8px 12px } .fiche ul{ max-height:24vh }
  }

  .boussole{ position:absolute; right:max(16px,env(safe-area-inset-right,0px)); bottom:calc(28px + env(safe-area-inset-bottom,0px)); width:34px; height:34px; border-radius:50%; background:var(--panel); backdrop-filter:blur(10px); pointer-events:none }
  .boussole i{ position:absolute; inset:0 } .boussole i::before{ content:""; position:absolute; left:50%; top:9px; width:2px; margin-left:-1px; height:16px; border-radius:1px; background:linear-gradient(var(--bleu) 50%,var(--muted) 50%) }
  .boussole b{ position:absolute; left:0; right:0; top:-1px; text-align:center; font-size:8px; line-height:10px; font-weight:700; color:var(--fg) }
  .titre{ padding:7px 12px; border-radius:12px } .titre .marque{ margin:0 }
</style>

</div>
